[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"
  MEDIA_HUB_RUNTIME = "netlify"
  SECRETS_SCAN_OMIT_KEYS = "MEDIA_HUB_PASSWORD"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/.next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"
